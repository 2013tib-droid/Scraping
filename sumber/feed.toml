# --------------------------------------------------------------------------- #
# Penambal blokir IP. Delapan feed (CNN ID, CNBC ID, Kontan, Media Indonesia)
# membalas 403 dari runner GitHub yang ada di AS — blokir berbasis IP, bukan
# header. Google News tidak diblokir dan justru mengagregasi penerbit yang sama,
# jadi isinya tetap masuk lewat sini. Lihat SUMBER-DATA.md §C3.

[[feed]]
nama = "Google News ekonomi ID"
url = "https://news.google.com/rss/search?q=ekonomi+Indonesia+when:1d&hl=id&gl=ID&ceid=ID:id"
kategori = "makro"
catatan = "memulihkan CNBC ID, CNN ID, dan Kompas.com yang tidak terjangkau langsung"

[[feed]]
nama = "Google News fiskal"
url = "https://news.google.com/rss/search?q=(APBN+OR+pajak+OR+Kemenkeu+OR+%22utang+pemerintah%22)+when:1d&hl=id&gl=ID&ceid=ID:id"
kategori = "makro"
catatan = "DDTCNews dan Kontan; topik fiskal jarang tertangkap feed umum"

# --------------------------------------------------------------------------- #
# Perpajakan. Diverifikasi 2026-09-10 — SUMBER-DATA.md §C4. Media pajak khusus
# (DDTCNews, Pajak.com, Ortax, IKPI) dan Bea Cukai tidak menyediakan RSS, jadi
# satu-satunya feed langsung adalah DJP; sisanya lewat Google News.

[[feed]]
nama = "DJP pengumuman"
url = "https://www.pajak.go.id/id/rss.xml"
kategori = "pajak"
bobot = 2.0
catatan = "judul saja; 0-1 item sehari itu normal. Pengumuman resmi: downtime, penghentian aplikasi"

[[feed]]
nama = "Google News DDTCNews"
url = "https://news.google.com/rss/search?q=site:news.ddtc.co.id+when:1d&hl=id&gl=ID&ceid=ID:id"
kategori = "makro"
catatan = "media pajak paling produktif, ~30 item sehari; tanpa RSS sendiri. Ikut memuat halaman tag — dibuang inti/pajak.py"

[[feed]]
nama = "Google News pajak"
url = "https://news.google.com/rss/search?q=(%22Ditjen+Pajak%22+OR+DJP+OR+Coretax+OR+PPN+OR+PPh+OR+%22wajib+pajak%22+OR+restitusi+OR+%22Bea+Cukai%22)+-kendaraan+-samsat+-PBB+-reklame+when:1d&hl=id&gl=ID&ceid=ID:id"
kategori = "makro"
catatan = "mentok 100 item dalam ~23 jam; pajak daerah dikurangi di query, sisanya diturunkan inti/pajak.py"
