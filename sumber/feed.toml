# Daftar feed RSS. Hasil verifikasi langsung 2026-09-09 — lihat SUMBER-DATA.md §C1
# untuk angka per feed dan §C2 untuk kandidat yang ditolak beserta alasannya.
#
# Dibaca dengan `tomllib` (stdlib sejak Python 3.11), tanpa dependensi tambahan.
#
# kategori: makro | pajak | pasar | politik | global
#           `pajak` hanya untuk feed yang SELURUH isinya pajak. Berita pajak dari
#           feed lain masuk bagian Perpajakan lewat isinya (inti/pajak.py).
# bobot   : pengali prioritas saat pengurutan. Feed bank sentral jarang terbit,
#           tapi kalau terbit hampir pasti layak dibaca — jumlah item bukan
#           ukuran nilai.

